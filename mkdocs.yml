site_name: Agent Adapter
# The Veloce docs host; it fills sitemap.xml and canonical links.
site_url: https://agent-adapter.veloceai.in/
site_description: Build with any framework. Ship with one safety layer. Approvals, budgets, cost and traces for every agent's tools.
repo_url: https://github.com/VeloceAI/agent-adapter
repo_name: VeloceAI/agent-adapter
edit_uri: ""
copyright: Copyright &copy; 2026 Veloce AI · Apache-2.0
exclude_docs: |
  superpowers/
theme:
  name: material
  # Favicon fallbacks and link-preview tags (overrides/main.html).
  custom_dir: overrides
  # System fonts: the site loads no font from a third-party host.
  font: false
  # The header is indigo in both schemes, so one white mark serves light and dark.
  logo: assets/mark-on-primary.svg
  favicon: assets/favicon.svg
  icon:
    repo: material/source-branch
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VeloceAI/agent-adapter
      name: Source on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-adapter/
      name: agent-adapter on PyPI
extra_css:
  - stylesheets/extra.css
# Mermaid served from the site itself, so diagrams render offline; the theme uses this global
# instead of fetching it from a CDN. Its MIT licence sits next to it.
extra_javascript:
  - path: assets/javascripts/vendor/mermaid-11.17.2.min.js
    defer: true
  - path: assets/javascripts/diagrams.js
    defer: true
# Each page's description (search results, link previews) from its first paragraph.
hooks:
  - scripts/docs_hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search:
      lang: en
      # Also split on dots, underscores and camelCase so `ToolSpec.invoke` finds "invoke".
      separator: '[\s\-,:!=\[\]()"`/_]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            heading_level: 3
