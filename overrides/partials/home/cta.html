<section class="aa-band aa-dark aa-ctaband">
  <div class="aa-inner aa-split">
    <div>
      <h2>Write it <span class="aa-hl">once.</span><br>Run it anywhere.</h2>
      <p class="aa-sub">Open source, Apache-2.0. Install it, attach it, ship it.</p>
      <button class="aa-install" type="button" data-aa-copy="pip install agent-adapter" title="Copy">
        <span class="aa-dollar">$</span> pip install agent-adapter <span class="aa-copyicon" aria-hidden="true"></span>
      </button>
      <div class="aa-ctas aa-ctas--left">
        <a class="aa-btn aa-btn--primary" href="{{ 'get-started/quickstart/' | url }}">Get started</a>
        <a class="aa-btn" href="https://github.com/VeloceAI/agent-adapter">Star on GitHub</a>
      </div>
    </div>
    <div class="aa-reelbox">
      <video class="aa-reel" src="{{ 'assets/video/agent-adapter-reel.mp4' | url }}" poster="{{ 'assets/video/agent-adapter-reel.jpg' | url }}" controls playsinline preload="none" aria-label="Agent Adapter in 29 seconds"></video>
      <a class="aa-more" href="{{ 'reel/' | url }}">Share this video &rarr;</a>
    </div>
  </div>
</section>
